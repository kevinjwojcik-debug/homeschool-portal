<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Homeschool Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      transition: background 0.25s, color 0.25s;
    }

    /* =========================================================================
       THEME 1: ASH'S HELLO KITTY STUDIO (PASTEL PINK, BOWS, STRAWBERRY CREAM)
       ========================================================================= */
    body.theme-ash {
      --bg-main: #fff0f6;
      --bg-pattern: radial-gradient(#ffc2d9 1.5px, transparent 1.5px);
      --panel-bg: #ffffff;
      --card-bg: #fff9fb;
      --border-col: #ff9ebb;
      --accent-primary: #ff3385;
      --accent-secondary: #ff80b3;
      --accent-badge: #ffe0ec;
      --text-primary: #591c36;
      --text-muted: #9e5876;
      --success-bg: #d8f8e1;
      --success-text: #116b2f;
      --font-heading: 'Fredoka', sans-serif;
      background-color: var(--bg-main);
      background-image: var(--bg-pattern);
      background-size: 22px 22px;
      color: var(--text-primary);
    }

    /* =========================================================================
       THEME 2: NOLAN'S DUCK & GOOSE MARSH LODGE (MALLARD GREEN, CEDAR, BRASS)
       ========================================================================= */
    body.theme-nolan {
      --bg-main: #f2ede2;
      --bg-pattern: radial-gradient(#d5ccb6 1.5px, transparent 1.5px);
      --panel-bg: #faf7f0;
      --card-bg: #ffffff;
      --border-col: #8c7a5b;
      --accent-primary: #1b4d3e;
      --accent-secondary: #b86b28;
      --accent-badge: #e2dec9;
      --text-primary: #1f2e27;
      --text-muted: #5a6b5c;
      --success-bg: #d1fae5;
      --success-text: #065f46;
      --font-heading: 'Zilla Slab', serif;
      background-color: var(--bg-main);
      background-image: var(--bg-pattern);
      background-size: 24px 24px;
      color: var(--text-primary);
    }

    /* =========================================================================
       THEME 3: PARENT EXECUTIVE OVERVIEW (CLEAN SLATE & INDIGO COMMAND)
       ========================================================================= */
    body.theme-admin {
      --bg-main: #f1f5f9;
      --panel-bg: #ffffff;
      --card-bg: #ffffff;
      --border-col: #cbd5e1;
      --accent-primary: #1e40af;
      --accent-secondary: #0284c7;
      --accent-badge: #e0f2fe;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --font-heading: 'Inter', sans-serif;
      background-color: var(--bg-main);

      color: var(--text-primary);

    }

    /* HEADER BAR */
    .portal-header {

      background: var(--panel-bg);
      border-bottom: 3px solid var(--border-col);

      padding: 8px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;


      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* DROPDOWNS & CONTROLS */
    .selector-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    select,
    input,
    textarea {
      background: var(--card-bg);
      color: var(--text-primary);
      border: 2px solid var(--border-col);
      border-radius: 10px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent-primary);
    }

    .btn {
      background: var(--accent-primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.15s;
      text-decoration: none;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--accent-badge);
      color: var(--text-primary);
      border: 2px solid var(--border-col);
    }

    .btn-success {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-amber {
      background: #d97706;
      color: #ffffff;
    }

    .btn-exam-toggle {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(79, 70, 229, 0.28);
    }

    .btn-exam-toggle.active-exam {
      background: #0f172a;
      border: 2px solid #7c3aed;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px;
    }

    /* STUDENT WORKSPACE LAYOUT */
    .student-workspace {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .student-workspace {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--border-col);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
    }

    .panel-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 2px dashed var(--border-col);
    }

    .panel-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin: 0;
    }

    /* DAY PILLS BAR */
    .day-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .day-pill {
      padding: 10px 8px;
      border-radius: 10px;
      border: 2px solid var(--border-col);
      background: var(--card-bg);
      text-align: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.84rem;
      transition: all 0.15s;
    }

    .day-pill.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }

    .day-pill.done-day {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: #16a34a;
    }

    .day-pill.done-day.active {
      box-shadow: 0 0 0 3px var(--accent-primary);
    }

    /* MODE SWITCH TABS */
    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mode-tab {
      padding: 9px 16px;
      border-radius: 99px;
      border: 2px solid var(--border-col);
      background: var(--card-bg);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .mode-tab.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }

    /* LARGE READING / WORKSHEET / QUIZ VIEWPORT */
    .large-viewport {
      background: var(--card-bg);
      border: 2px solid var(--border-col);
      border-radius: 12px;
      padding: 20px;
      min-height: 460px;
      max-height: 620px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 0.98rem;
      line-height: 1.68;
    }

    .daily-focus-banner {
      background: var(--accent-badge);
      border-left: 5px solid var(--accent-primary);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    /* LARGE SOCRATIC TUTOR WINDOW */
    .tutor-window {
      background: var(--card-bg);
      border: 2px solid var(--border-col);
      border-radius: 12px;
      padding: 14px;
      min-height: 220px;
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .chat-tutor {
      background: var(--accent-badge);
      border: 1px solid var(--border-col);
      align-self: flex-start;
    }

    .chat-student {
      background: var(--accent-primary);
      color: #ffffff;
      align-self: flex-end;
    }

    /* PARENT ADMIN TABLES & CARDS */
    .admin-grid-top {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .matrix-table th,
    .matrix-table td {
      border-bottom: 1px solid var(--border-col);
      padding: 10px 8px;
      text-align: left;
      vertical-align: middle;
    }

    .matrix-table th {
      background: #f8fafc;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.74rem;
    }

    .status-chip {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .chip-done {
      background: #dcfce7;
      color: #166534;
    }

    .chip-missing {
      background: #fee2e2;
      color: #991b1b;
    }

    .chip-warn {
      background: #fef9c3;
      color: #854d0e;
    }

    .day-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-right: 3px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
    }

    .day-dot.is-done {
      background: #16a34a;
      color: #ffffff;
      border-color: #15803d;
    }

    .day-dot.is-missing {
      background: #f1f5f9;
      color: #64748b;
    }

    /* NATIVE SEMESTER EXAM HUB STYLES */
    .exam-course-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .exam-course-pill {
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid var(--border-col);
      background: var(--panel-bg);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .exam-course-pill.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }

    .exam-unit-card {
      background: var(--card-bg);
      border: 2px solid var(--border-col);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .exam-q-card {
      background: var(--card-bg);
      border: 2px solid var(--border-col);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .exam-opt-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      margin-top: 8px;
      border-radius: 10px;
      border: 2px solid var(--border-col);
      background: var(--panel-bg);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.12s;
    }

    .exam-opt-btn:hover {
      border-color: var(--accent-primary);
    }

    .exam-opt-btn.opt-correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #14532d;
    }

    .exam-opt-btn.opt-wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #7f1d1d;
    }

    .exam-explain-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .unit-bar-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 4px;
    }

    .unit-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s;
    }
  </style>
</head>

      'A_BIBLE': {

        units: [
          { name: 'Unit 1: Operational vs. Historical Science & Worldview (W1–W3)', items: ['Operational Science (repeatable, observable, testable in the present) vs. Historical Science (interpreting past origins)', 'Imago Dei (Genesis 1:26–27) & the foundation of human dignity/ethics ("all men are created")', 'Micro-adaptation/natural selection within created kinds vs. macroevolution (which requires new functional genetic information)'] },
          { name: 'Unit 2: Information Theory & Law of Biogenesis (W4–W6)', items: ['Law of Biogenesis (Louis Pasteur): Life only comes from pre-existing life, refuting spontaneous abiogenesis', 'DNA as a semantic 4-character code: Specified functional information always originates from an intelligent mind', 'Thermodynamics & Cosmology challenges to secular self-creation models'] },
          { name: 'Unit 3: Teleological Fine-Tuning & Irreducible Complexity (W7–W10)', items: ['Teleological Argument (Romans 1:20): Fine-tuning of the Strong Nuclear Force & Cosmological Constant', 'Irreducible Complexity (Blood Clotting Cascade): All interacting parts must be present simultaneously for function', 'Physical clocks: Soft tissue/collagen and Carbon-14 in dinosaur/coal strata'] }
        ],
        defensePrompt: 'Using your Week 9 Apologetics worksheet, explain what happens if the Strong Nuclear Force is altered slightly, and use the Blood Clotting Cascade to define Irreducible Complexity.',
        questions: [
          { unit: 'Unit 1', q: 'What is the key distinction between Operational Science and Historical (Origins) Science?', opts: ['Operational science uses math while historical science does not', 'Operational science tests repeatable, observable present-day phenomena; historical science interprets unrepeatable past events', 'Historical science is tested in a laboratory', 'Operational science only studies rocks'], ans: 1, exp: 'Operational science relies on repeatable, observable experiments in the present, whereas historical science reconstructs past events using worldview assumptions.' },
          { unit: 'Unit 1', q: 'Why does observable natural selection (such as finch beak variations or dog breeding) NOT prove molecules-to-man macroevolution?', opts: ['Natural selection only sorts or loses existing genetic information rather than generating new functional genetic blueprints', 'Natural selection never happens in nature', 'Finches are not living organisms', 'Mutations always add brand-new organs'], ans: 0, exp: 'Adaptation and natural selection shuffle or pare down pre-existing genetic traits within a created kind, whereas macroevolution requires adding massive amounts of new genetic information.' },
          { unit: 'Unit 2', q: 'What scientific law—demonstrated by Louis Pasteur—states that life in the material world only arises from pre-existing life?', opts: ['Law of Uniformitarianism', 'Law of Biogenesis', 'Second Law of Thermodynamics', 'Law of Superposition'], ans: 1, exp: 'The Law of Biogenesis demonstrates empirically that living organisms only come from other living organisms, directly challenging chemical abiogenesis.' },
          { unit: 'Unit 2', q: 'Why does the four-letter nucleotide code inside DNA point directly to an intelligent Creator?', opts: ['Because chemicals naturally arrange themselves into alphabetical sentences', 'Because specified, semantic information and coding systems only ever originate from an intelligent mind', 'Because DNA is a simple repeating crystal like salt', 'Because RNA has no structure'], ans: 1, exp: 'In all human observation (information theory), coded language and specified functional instructions invariably trace back to a mind, never random physical law.' },
          { unit: 'Unit 3', q: 'In cosmological fine-tuning, what would happen if the Strong Nuclear Force were just slightly weaker?', opts: ['Protons could not bind together in atomic nuclei, leaving hydrogen as the only element in the universe (no carbon or chemistry for life)', 'Space would expand too rapidly', 'Gravity would reverse', 'All stars would turn into ice'], ans: 0, exp: 'If the Strong Nuclear Force were slightly weaker, multi-proton nuclei could not hold together, making carbon-based life chemically impossible.' },
          { unit: 'Unit 3', q: 'How does the human Blood Clotting Cascade illustrate Irreducible Complexity?', opts: ['It only uses one single protein', 'If any single clotting factor is missing, the entire cascade fails and the organism bleeds to death or clots solid', 'Blood clots without any proteins', 'It evolved one protein per million years'], ans: 1, exp: 'An irreducibly complex system requires every well-matched component to be present simultaneously in regulated order for the system to function at all.' }

      'A_HIST': {

        prompt: 'Act as my High School History & Civics Exam Evaluator. Quiz me interactively across Unit 1 (The Gospel & Magna Carta 1215), Unit 2 (The Reformation, Mayflower Compact & Great Awakening), and Unit 3 (Articles of Confederation, Great Compromise, Federalist No. 51 & Bill of Rights). Ask 1 question at a time and generate a Strengths & Weaknesses Diagnostic Report.',
        units: [
          { name: 'Unit 1: Early Church & Magna Carta (W1–W3)', items: ['Early Church compassion during the Plague of Cyprian & dignity of every human life', 'Magna Carta (1215 at Runnymede): Forced King John to accept Lex Rex ("The Law is King")', 'Foundational liberties: Due process, habeas corpus, trial by jury, no taxation without representation'] },
          { name: 'Unit 2: Reformation, Mayflower & Great Awakening (W4–W8)', items: ['Gutenberg press, Luther\'s 95 Theses (1517), Tyndale\'s English Bible & liberty of conscience', 'Mayflower Compact (1620 civil body politic) & William Bradford\'s 1623 shift from communal farming to private property', 'Great Awakening: George Whitefield & Jonathan Edwards uniting the 13 colonies before 1776'] },

        defensePrompt: 'Explain how William Bradford\'s 1623 property reform saved Plymouth Colony from famine, and how James Madison\'s quote in Federalist No. 51 ("If men were angels...") justifies Separation of Powers.',
        questions: [
          { unit: 'Unit 1', q: 'What revolutionary legal principle was established at Runnymede in 1215 when English barons forced King John to sign the Magna Carta?', opts: ['Rex Lex (The King is above the Law)', 'Lex Rex (The Law is King — even the monarch is subject to the law)', 'Universal direct democracy', 'Abolition of Parliament'], ans: 1, exp: 'Magna Carta established Lex Rex (the rule of law over arbitrary royal power), laying the groundwork for due process and trial by jury.' },
          { unit: 'Unit 1', q: 'How did John Locke\'s Two Treatises of Government build on earlier constitutional traditions to influence the American Founders?', opts: ['It argued that kings rule by unconditional divine right', 'It argued that governments exist by consent of the governed to secure God-given natural rights to life, liberty, and property', 'It called for abolishing private property', 'It opposed written constitutions'], ans: 1, exp: 'Locke articulated that legitimate government is a social compact formed to protect natural rights to life, liberty, and property.' },
          { unit: 'Unit 2', q: 'According to Governor William Bradford\'s Of Plimoth Plantation, what policy change in 1623 ended Plymouth\'s chronic food shortages?', opts: ['Importing food from Spain', 'Replacing the communal "common course" with private land parcels for each family to farm', 'Forcing everyone into military barracks', 'Abandoning agriculture for fur trading'], ans: 1, exp: 'Assigning each family its own parcel of land incentivized personal stewardship and industriousness, immediately producing an agricultural surplus.' },
          { unit: 'Unit 2', q: 'How did the First Great Awakening (led by figures like George Whitefield and Jonathan Edwards) help prepare the 13 colonies for the American Revolution?', opts: ['It forged inter-colonial unity, emphasized spiritual equality before God, and challenged state-established church monopolies', 'It convinced colonists to surrender to the British Crown', 'It outlawed printing presses', 'It only occurred in one single town'], ans: 0, exp: 'Whitefield\'s preaching tour united all 13 colonies in a shared spiritual movement that emphasized individual liberty and accountability under God.' },
          { unit: 'Unit 3', q: 'How did the Great (Connecticut) Compromise of 1787 resolve the deadlock between the Virginia Plan and the New Jersey Plan?', opts: ['It created a unicameral Congress', 'It created a bicameral Congress: the House of Representatives based on population and the Senate with 2 senators per state', 'It let the President appoint all members of Congress', 'It abolished state governments'], ans: 1, exp: 'The Great Compromise balanced large and small states by apportioning the House by population and giving every state equal representation (2 senators) in the Senate.' },
          { unit: 'Unit 3', q: 'In Federalist No. 51, why did James Madison write, "If men were angels, no government would be necessary"?', opts: ['To argue that government officials never make mistakes', 'To explain why fallen human nature requires both an energetic government AND internal Checks and Balances / Separation of Powers', 'To oppose ratification of the Constitution', 'To argue against having a judicial branch'], ans: 1, exp: 'Madison argued that because both citizens and rulers are flawed human beings, power must be divided across three branches so "ambition must be made to counteract ambition."' }

      'A_LIFE': {

          { unit: 'Unit 2', q: 'If your monthly Gross Pay is $3,000 and your Net Take-Home Pay is $2,550, what percentage of your gross income was withheld for taxes/deductions?', opts: ['12%', '15%', '18%', '20%'], ans: 1, exp: 'Tax Withholding % = (($3,000 - $2,550) / $3,000) * 100 = ($450 / $3,000) * 100 = 15%.' },

          { unit: 'Unit 3', q: 'What is the difference between an 18% APR finance charge and an extended product warranty?', opts: ['They are the exact same fee', 'APR interest is a fee paid to a lender for borrowing money; a warranty is a service contract for repair or replacement if the hardware fails', 'APR interest extends the laptop\'s battery life', 'A warranty lowers your sales tax'], ans: 1, exp: 'Credit interest compensates a bank/lender for borrowed time and adds zero product protection, whereas a warranty covers physical repair/replacement.' }

    function sanitizeExamDiagnostic(diag) {
      if (!diag) return diag;
        let correct = diag.correct;
          if (correct instanceof Date) {
              correct = (correct.getUTCMonth() + 1) + '/' + correct.getUTCDate();
                } else if (typeof correct === 'string') {

                    if (/^\d{4}-\d{2}-\d{2}/.test(correct)) {
                          var match = correct.match(/^\d{4}-(\d{2})-(\d{2})/);
                                if (match) {
                                        correct = parseInt(match[1], 10) + '/' + parseInt(match[2], 10);
                                              }
                                                  }
                                                    }
                                                    
                                                      var mastery = diag.masteryPct;
                                                        if (typeof mastery === 'number') {
                                                            mastery = mastery <= 1 ? Math.round(mastery * 100) + '%' : Math.round(mastery) + '%';
                                                              } else if (typeof mastery === 'string') {
                                                                  mastery = mastery.trim();
                                                                      if (mastery.indexOf('%') === -1) {
                                                                            var val = parseFloat(mastery);
                                                                                  if (!isNaN(val)) {
                                                                                          mastery = val <= 1 ? Math.round(val * 100) + '%' : Math.round(val) + '%';
                                                                                                }
                                                                                                    }


                                                                                                      }
                                                                                                      
                                                                                                        return Object.assign({}, diag, { correct: correct, masteryPct: mastery });
                                                                                                        }
                                                                                                        function getCourseExamDiagnostic(course) {
      if (!PORTAL_DATA || !PORTAL_DATA.examReadiness || !course) return null;
      const studentMap = PORTAL_DATA.examReadiness[course.cadet] || {};
      const entries = Object.keys(studentMap);
      if (!entries.length) return null;

      const subjLower = String(course.subject || '').toLowerCase();
      for (let i = 0; i < entries.length; i++) {
        const key = entries[i];
        const item = studentMap[key];
        const keyLower = String(key || '').toLowerCase();
        const titleLower = String(item.courseTitle || '').toLowerCase();
        if (
          keyLower === String(course.id || '').toLowerCase() ||

          keyLower.indexOf(subjLower) !== -1 ||
          titleLower.indexOf(subjLower) !== -1 ||


          subjLower.indexOf(keyLower) !== -1

        ) {


          return  sanitizeExamDiagnostic(item);
        }
      }
      return null;
    }

    function computeExamMetrics(courseId) {
      const bank = EXAM_BANK[courseId];
      const st = getCourseExamState(courseId);
      if (!bank) return { answered: 0, correct: 0, total: 6, pct: 0, unitStats: {}, weakUnits: [] };

      let answered = 0;
      let correct = 0;
      const unitStats = {};

      bank.questions.forEach((qObj, idx) => {
        if (!unitStats[qObj.unit]) unitStats[qObj.unit] = { right: 0, total: 0 };
        unitStats[qObj.unit].total++;
        const chosen = st.answers[idx];
        if (chosen !== undefined && chosen !== null) {
          answered++;
          if (chosen === qObj.ans) {
            correct++;
            unitStats[qObj.unit].right++;
          }
        }
      });

      const total = bank.questions.length;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      const weakUnits = [];
      Object.keys(unitStats).forEach(uName => {
        const u = unitStats[uName];
        const uPct = u.total > 0 ? Math.round((u.right / u.total) * 100) : 0;
        u.pct = uPct;
        if (uPct < 80) weakUnits.push(`${uName} (${uPct}%)`);
      });

      return { answered, correct, total, pct, unitStats, weakUnits };
    }

        <!-- SEMESTER EXAM DIAGNOSTIC READINESS OVERVIEW PANEL -->
        <div class="panel" style="margin-bottom:22px;">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">🎯 Semester Exam Diagnostic Readiness & Weak-Unit Tracker (Day 1 to Today)</h2>
              <div class="brand-sub">Live diagnostic scores, unit strengths/weaknesses, and AI-proof defenses synced from Ash and Nolan's Semester Exam Prep Hubs.</div>

            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-exam-toggle" onclick="switchAdminPreview('ash', 'exam_prep')">🎀 Open Ash Exam Hub</button>
              <button class="btn btn-exam-toggle" onclick="switchAdminPreview('nolan', 'exam_prep')">🦆 Open Nolan Exam Hub</button>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(420px, 1fr)); gap:16px;">

            <!-- ASH EXAM DIAGNOSTICS -->




            <div style="border:1px solid #fbcfe8; background:#fff9fb; border-radius:12px; padding:14px;">



    <div style="font-weight:700; color:#be185d; margin-bottom:8px; font-size:0.95rem;">

                  🎀 Ash (9th Grade) – Synced Exam Diagnostics (${ashExamEntries.length === 0 ? 'Awaiting First Diagnostic • 0/7 Logged' : ashExamEntries.length + '/7 Courses Logged'})
                    </div>


  ${ashExamEntries.length === 0 ? `
      <div style="font-size:0.84rem; color:var(--text-muted); background:rgba(255,255,255,0.7); padding:10px 12px; border-radius:8px; border:1px dashed #fbcfe8; line-height:1.45;">
            ✨ <strong>Ready for Semester Diagnostics:</strong> No exam diagnostics recorded yet. Click <strong>🎯 Ash Exam Hub</strong> above to take course diagnostics and sync mastery scores!

                </div>

                   ` : ashExamEntries.map(d => `
                <div style="padding:8px 0; border-bottom:1px solid #fce7f3; font-size:0.82rem;">
                  <div style="display:flex; justify-content:space-between; font-weight:700;">
                    <span>${d.courseTitle || 'Course'}</span>
                    <span style="color:#be185d;">${d.masteryPct} (${d.correct})</span>
                  </div>
                  <div style="color:#64748b; font-size:0.76rem; margin-top:2px;">Units: ${d.unitBreakdown || 'N/A'}</div>
                  <div style="color:${String(d.weakUnits || '').indexOf('None') !== -1 ? '#166534' : '#b45309'}; font-size:0.76rem; font-weight:600;">
                    Priority Review (<80%): ${d.weakUnits || 'None'}
                  </div>

                </div>
              `).join('')}
            <!-- NOLAN EXAM DIAGNOSTICS -->
            <div style="border:1px solid #cbd5e1; background:#f8fafc; border-radius:12px; padding:14px;">

              <div style="font-weight:700; color:#1b4d3e; margin-bottom:8px; font-size:0.95rem;">

                    🦆 Nolan (7th Grade) – Synced Exam Diagnostics (${nolanExamEntries.length === 0 ? 'Awaiting First Diagnostic • 0/7 Logged' : nolanExamEntries.length + '/7 Courses Logged'})
              </div>

  ${nolanExamEntries.length === 0 ? `
      <div style="font-size:0.84rem; color:var(--text-muted); background:rgba(255,255,255,0.7); padding:10px 12px; border-radius:8px; border:1px dashed #cbd5e1; line-height:1.45;">
            ✨ <strong>Ready for Semester Diagnostics:</strong> No exam diagnostics recorded yet. Click <strong>🎯 Nolan Exam Hub</strong> above to take course diagnostics and sync mastery scores!
                </div>


                  ` : nolanExamEntries.map(d => `

                <div style="padding:8px 0; border-bottom:1px solid #e2e8f0; font-size:0.82rem;">
                  <div style="display:flex; justify-content:space-between; font-weight:700;">
                    <span>${d.courseTitle || 'Course'}</span>
                    <span style="color:#1b4d3e;">${d.masteryPct} (${d.correct})</span>
                  </div>
                  <div style="color:#64748b; font-size:0.76rem; margin-top:2px;">Units: ${d.unitBreakdown || 'N/A'}</div>
                  <div style="color:${String(d.weakUnits || '').indexOf('None') !== -1 ? '#166534' : '#b45309'}; font-size:0.76rem; font-weight:600;">
                    Priority Review (<80%): ${d.weakUnits || 'None'}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- WEEKLY STATUS MATRIX -->
        <div class="panel">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">📋 Weekly Assignment Status Matrix (${SELECTED_WEEK} — ${DAY_LABELS[SELECTED_DAY]})</h2>
              <div class="brand-sub">Click any M/T/W/Th/F box to toggle daily completion, click "Complete Day (No Grade)" when grading isn't needed, or run Gemini 3.8 Flash Grader.</div>
            </div>
          </div>

          <div style="overflow-x:auto;">
            <table class="matrix-table">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Course & ${SELECTED_WEEK} Topic</th>
                  <th>Gradebook & Exam Readiness</th>
                  <th>Weekly Days (M–F)</th>
                  <th>${SELECTED_DAY} Status</th>
                  <th>Actions (Complete Day OR Grade with Gemini 3.8 Flash)</th>
                </tr>
              </thead>
              <tbody>
                ${courses.map(c => {
                  const dMap = c.dayStatus || {};
                  const todayDone = Boolean(dMap[SELECTED_DAY]) || Boolean(c.dailyDone);
                  const completedDaysCount = ['D1','D2','D3','D4','D5'].filter(k => dMap[k]).length;
                  const examDiag = getCourseExamDiagnostic(c);
                  return `
                    <tr>
                      <td><strong>${c.cadet}</strong></td>
                      <td>
                        <div style="font-weight:700;">${c.subject}</div>
                        <div style="font-size:0.78rem; color:var(--text-muted);">${c.missionTask}</div>
                      </td>
                      <td>
                        <strong>${c.score}</strong><br>
                        <span style="font-size:0.74rem; color:var(--text-muted);">${c.pointsSummary}</span>
                        ${examDiag ? `
                          <div style="margin-top:4px;">
                            <span class="status-chip chip-done" style="font-size:0.7rem;">🎯 Exam Prep: ${examDiag.masteryPct}</span>
                          </div>
                        ` : ''}
                      </td>
                      <td>
                        ${['D1','D2','D3','D4','D5'].map((dk, idx) => {
                          const labels = ['M','T','W','Th','F'];
                          const done = Boolean(dMap[dk]);
                          return `<span class="day-dot ${done ? 'is-done' : 'is-missing'}"
                                        title="Toggle ${DAY_LABELS[dk]}"
                                        onclick="markDayCompletion('${c.id}', '${dk}', ${!done}, this)">${labels[idx]}</span>`;
                        }).join('')}
                        <div style="font-size:0.72rem; color:var(--text-muted); margin-top:3px;">${completedDaysCount}/5 Days Done</div>
                      </td>
                      <td>
                        <span class="status-chip ${todayDone ? 'chip-done' : 'chip-missing'}">
                          ${todayDone ? '✓ COMPLETED' : '⚠ MISSING / PENDING'}
                        </span>
                      </td>
                      <td>
                        <div style="display:flex; flex-wrap:wrap; gap:6px;">
                          ${!todayDone ? `
                            <button class="btn btn-success" style="padding:6px 10px; font-size:0.78rem;"
                              onclick="markDayCompletion('${c.id}', '${SELECTED_DAY}', true, this)">
                              ✓ Complete Day (No Grade)
                            </button>
                          ` : `
                            <button class="btn btn-secondary" style="padding:6px 10px; font-size:0.78rem;"
                              onclick="markDayCompletion('${c.id}', '${SELECTED_DAY}', false, this)">
                              ↩ Undo Day
                            </button>
                          `}

                          <button class="btn btn-amber" style="padding:6px 10px; font-size:0.78rem;"

                            onclick="adminGradeWithGemini('${c.id}', this)">
                            ✨ Grade w/ Gemini 3.8 Flash
                          </button>

                          <button class="btn btn-secondary" style="padding:6px 10px; font-size:0.78rem;"
                            onclick="launchFullScreenDoc('${c.id}', 'Assignment', this)">
                            📄 Doc
                          </button>
                        </div>

                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       ACTIONS: WRITE-BACK COMPLETION, FULL-SCREEN DOCS, TUTOR, GEMINI GRADER
       ========================================================================= */
    function markDayCompletion(courseId, dayKey, markDone, btnEl) {
      const courses = (PORTAL_DATA && PORTAL_DATA.courses) ? PORTAL_DATA.courses : [];
      const course = courses.find(c => c.id === courseId);
      if (!course) return;

      if (btnEl) {
        btnEl.disabled = true;
        if (btnEl.tagName === 'BUTTON') btnEl.innerText = 'Saving...';
      }

      google.script.run
        .withSuccessHandler(res => {

          if (res && res.ok) {
            course.dailyDone = res.dailyDone;
            course.status = res.status;
            course.dayStatus = res.dayStatus || course.dayStatus;

            renderApp();
          } else {
            alert('Write-back failed: ' + (res && res.error ? res.error : 'Unknown error'));
            if (btnEl) btnEl.disabled = false;
          }
        })
        .withFailureHandler(err => {

          alert('Write-back error: ' + err.message);
          if (btnEl) btnEl.disabled = false;
        })
        .updateMissionStatus({

          id: course.id,
          rowIndex: course.rowIndex,
          cadet: course.cadet,
          week: SELECTED_WEEK,
          day: dayKey,
          subject: course.subject,
          dailyDone: markDone
        });
    }


    function launchFullScreenDoc(courseId, docType, btnEl) {

      const courses = (PORTAL_DATA && PORTAL_DATA.courses) ? PORTAL_DATA.courses : [];
      const course = courses.find(c => c.id === courseId);

      if (!course) return;

      const origText = btnEl.innerText;
      btnEl.disabled = true;
      btnEl.innerText = 'Opening Editable Doc...';

      google.script.run
        .withSuccessHandler(res => {
          btnEl.disabled = false;


          btnEl.innerText = origText;
          if (res && res.ok && res.url) {
            if (docType === 'Quiz') course.quizUrl = res.url;
            else course.docUrl = res.url;
            window.open(res.url, '_blank');
          } else {
            alert('Could not open document: ' + (res && res.error ? res.error : 'Unknown error'));
          }
        })
        .withFailureHandler(err => {

          btnEl.disabled = false;
          btnEl.innerText = origText;

          alert('Document error: ' + err.message);

        })
        .resolveOrCreateAssignmentDoc({

          id: course.id,

          cadet: course.cadet,
          subject: course.subject,
          week: SELECTED_WEEK,
          docType: docType,
          missionTask: course.missionTask,
          readingText: course.readingText,
          existingUrl: docType === 'Quiz' ? course.quizUrl : course.docUrl
        });
    }

    function sendTutorQuestion(courseId) {

      const input = document.getElementById('tutorInput');
      const question = input ? input.value.trim() : '';
      if (!question) return;

      const courses = (PORTAL_DATA && PORTAL_DATA.courses) ? PORTAL_DATA.courses : [];
      const course = courses.find(c => c.id === courseId);
      if (!course) return;

      TUTOR_HISTORY[courseId] = TUTOR_HISTORY[courseId] || [];
      TUTOR_HISTORY[courseId].push({ role: 'student', text: question });
      input.value = '';
      renderStudentPortal();

      const sendBtn = document.getElementById('tutorSendBtn');
      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.innerText = 'Thinking...';
      }

      google.script.run
        .withSuccessHandler(res => {
          TUTOR_HISTORY[courseId].push({
            role: 'tutor',
            text: (res && res.reply) ? res.reply : 'Let\'s look closely at the reading passage together!'
          });
          renderStudentPortal();
          const box = document.getElementById('tutorChatBox');
          if (box) box.scrollTop = box.scrollHeight;
        })
        .withFailureHandler(err => {
          TUTOR_HISTORY[courseId].push({ role: 'tutor', text: 'Tutor error: ' + err.message });
          renderStudentPortal();
        })
        .askSocraticTutor({
          cadet: course.cadet,
          subject: course.subject,
          missionTask: course.missionTask,
          readingText: course.readingText,
          question: question
        });
    }

    function turnInStudentWork(courseId, btnEl) {
      const courses = (PORTAL_DATA && PORTAL_DATA.courses) ? PORTAL_DATA.courses : [];
      const course = courses.find(c => c.id === courseId);
      if (!course) return;

      const linkVal = (document.getElementById('turnInLink') || {}).value || '';
      const notesVal = (document.getElementById('turnInNotes') || {}).value || '';

      btnEl.disabled = true;
      btnEl.innerText = 'Turning In & Grading...';

      google.script.run
        .withSuccessHandler(res => {
          btnEl.disabled = false;
          if (res && res.ok) {
            course.dailyDone = true;
            course.score = res.score || course.score;
            course.feedback = res.feedback || '';
            course.submittedLink = linkVal;
            course.dayStatus = res.dayStatus || course.dayStatus;
            renderApp();
          } else {
            btnEl.innerText = '📤 Turn In Assignment & Grade';
            alert('Error turning in: ' + (res && res.error ? res.error : 'Unknown error'));
          }
        })
        .withFailureHandler(err => {
          btnEl.disabled = false;
          btnEl.innerText = '📤 Turn In Assignment & Grade';
          alert('Submission error: ' + err.message);
        })
        .submitAndGradeWithGemini({
          id: course.id,
          rowIndex: course.rowIndex,
          cadet: course.cadet,
          week: SELECTED_WEEK,
          day: SELECTED_DAY,
          subject: course.subject,
          missionTask: course.missionTask,
          submittedLink: linkVal,
          studentResponse: notesVal,
          docUrl: course.docUrl,
          quizUrl: course.quizUrl
        });
    }

    function adminGradeWithGemini(courseId, btnEl) {
      const courses = (PORTAL_DATA && PORTAL_DATA.courses) ? PORTAL_DATA.courses : [];
      const course = courses.find(c => c.id === courseId);
      if (!course) return;

      btnEl.disabled = true;
      btnEl.innerText = 'Grading...';

      google.script.run
        .withSuccessHandler(res => {
          btnEl.disabled = false;
          if (res && res.ok) {
            course.dailyDone = true;
            course.score = res.score || course.score;
            course.feedback = res.feedback || '';
            course.dayStatus = res.dayStatus || course.dayStatus;
            renderApp();
            alert(`${course.cadet} — ${course.subject} (${SELECTED_WEEK}):\nScore: ${res.score}\n\n${res.feedback}`);
          } else {
            btnEl.innerText = '✨ Grade w/ Gemini 3.8 Flash';
            alert('Grading error: ' + (res && res.error ? res.error : 'Unknown'));
          }
        })
        .withFailureHandler(err => {
          btnEl.disabled = false;
          btnEl.innerText = '✨ Grade w/ Gemini 3.8 Flash';
          alert('Error: ' + err.message);
        })
        .submitAndGradeWithGemini({
          id: course.id,
          rowIndex: course.rowIndex,
          cadet: course.cadet,
          week: SELECTED_WEEK,
          day: SELECTED_DAY,
          subject: course.subject,
          missionTask: course.missionTask,
          submittedLink: course.submittedLink || course.docUrl,
          docUrl: course.docUrl,
          quizUrl: course.quizUrl
        });
    }
  </script>
</body>

</html>
